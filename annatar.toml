# Annatar configuration. This is the default file the binary loads; pass
# `--config <FILE>` to point elsewhere. Relative paths resolve against this
# file's directory, not the current working directory.

# Repository to index.
repo = "."

# Directory holding the two libSQL files: index.db and cache.db.
data_dir = ".annatar"

# Regex used to find Jira ticket keys in commit messages and bodies. No
# trailing `\b`: branch-style subjects like `GRLD-123_Fix_login` put a `_`
# (a word character) right after the digits.
ticket_regex = '\bGRLD-\d+'

# Jira connection. Optional: without it (or without ANNATAR_JIRA_TOKEN)
# `annatar index` warns once and uses only tickets already in cache.db;
# `annatar index --offline` does the same even when Jira is configured.
# Secrets come from the environment, never from this file:
#   ANNATAR_JIRA_TOKEN  API token (Cloud) or personal access token (Server/DC)
#   ANNATAR_JIRA_EMAIL  Cloud only; when set, requests use basic auth
#                       email:token, otherwise the token is sent as a bearer PAT
# [jira]
# base_url = "https://acme.atlassian.net"
# Custom field holding the epic link (Server/DC), used when an issue has no
# parent. Unset = ignored.
# epic_link_field = "customfield_10100"
# Maximum Jira requests in flight while fetching tickets (default 4).
# concurrency = 4

# Ollama connection, used through its OpenAI-compatible /v1 API. Optional:
# without it `annatar index` warns once and tickets get no summaries, symbols
# no description and no vector; `annatar index --no-llm` makes no chat or
# embedding calls and uses only summaries, descriptions and embeddings already
# cached. LLM replies and embeddings are cached in cache.db; changing a model,
# reasoning_effort or temperature simply misses the cache. `index` fails when
# the server lacks chat_model or embedding_model. The vector dimension comes
# from the embedding model's first response, not from this file. `annatar
# search` embeds its query with embedding_model and refuses an index built
# with another one.
# [ollama]
# Server root (a trailing /v1 is accepted).
# url = "http://localhost:11434"
# chat_model = "qwen3.8:latest"
# embedding_model = "bge-m3:latest"
# reasoning_effort sent with chat requests: "none" (default) turns a thinking
# model's reasoning off, "low" / "medium" / "high" turn it on, "" leaves it to
# the model. Part of the LLM cache key.
# reasoning_effort = "none"
# Sampling temperature sent with chat requests, 0.0 (default: greedy, so a
# regenerated record matches the cached one) to 2.0. Part of the LLM cache key.
# temperature = 0.0
# max_tokens sent with chat requests (default 1024; 0 = not sent): a safety
# cap that stops a looping reply, far above any real one, not a length limit.
# A reply cut off at the cap is invalid (retried once, never cached). With a
# reasoning_effort other than "none" the reasoning counts against it, so raise
# it then. Not part of the LLM cache key (a complete reply is the same under
# any cap).
# max_tokens = 1024

# What goes into the method, constructor and type description prompts. Optional;
# every value changes the prompts, so changing one misses the LLM cache.
# [describe]
# Most recent tickets shown besides the member's first (oldest) ticket
# (default 3); each with its summary and purpose from the ticket summaries.
# recent_tickets = 3
# Most recent commit subjects shown for every member and type, besides its
# tickets (default 5; merge commits, subjects starting with "Merge " or
# "Merged ", left out).
# commit_subjects = 5
# Characters of the member's source (declaration and body), or of a type's
# declaration with its members cut out, shown (default 1500); 0 sends only the
# signature and Javadoc.
# body_chars = 1500
# Members and nested types listed with their description in a type's prompt, public
# ones first (default 30); the rest are only counted.
# type_members = 30
# Most recent tickets shown besides a type's first ticket (default 3). A
# type's history spans its whole body, so these are about the file's tickets.
# type_recent_tickets = 3

# What goes into the text embedded for every described symbol. Optional;
# changing it re-embeds every symbol once (embedding calls only, no chat calls).
# [embedding]
# Append the enclosing type's description to a method's or constructor's
# text, after its fqn and description (default false: fqn and description).
# parent_description = false
