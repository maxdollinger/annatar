[package]
name = "annatar"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.5.5"
clap = { version = "4.6.7", features = ["derive"] }
html2text = "0.17.1"
ignore = "0.4.25"
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "rustls",
] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tree-sitter = "0.25.10"
tree-sitter-java = "0.23.5"
